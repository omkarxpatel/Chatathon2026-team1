# Committed on purpose: without headless, `streamlit run` stops on a first-run
# "enter your email" prompt and never starts the server. Nobody wants to
# discover that ten minutes before a demo.

[server]
headless = true          # skip the email prompt; do not auto-open a browser
port = 8501

[browser]
gatherUsageStats = false

# A restrained green accent for navigation and actions. Risk colors are
# reserved for labeled risk badges in app/theme.py.
[theme]
base = "light"
primaryColor = "#266854"
backgroundColor = "#f6f7f4"
secondaryBackgroundColor = "#ffffff"
textColor = "#202b27"
linkColor = "#266854"
borderColor = "#e1e6df"
baseRadius = "medium"
font = "system-ui, -apple-system, 'Segoe UI', sans-serif"
headingFont = "system-ui, -apple-system, 'Segoe UI', sans-serif"

[theme.sidebar]
backgroundColor = "#eef1eb"
borderColor = "#e1e6df"
